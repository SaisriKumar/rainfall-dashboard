<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainfall Data Search & Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f7f6; }
        #search-container { margin-bottom: 20px; }
        input { padding: 10px; width: 300px; border-radius: 5px; border: 1px solid #ccc; }
        #main-content { display: flex; gap: 20px; height: 500px; }
        #results { width: 30%; overflow-y: auto; background: white; padding: 10px; border-radius: 8px; border: 1px solid #ddd; }
        #map { width: 70%; border-radius: 8px; border: 1px solid #ddd; }
        .data-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
        .data-item:hover { background-color: #e9f5ff; }
    </style>
</head>
<body>

    <h2>Rainfall Data Dashboard</h2>
    
    <div id="search-container">
        <input type="text" id="searchInput" placeholder="Search by District or Station..." onkeyup="filterData()">
    </div>

    <div id="main-content">
        <div id="results">
            <div id="list"></div>
        </div>
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
